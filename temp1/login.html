<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadpool - Log In</title>
    <link rel="stylesheet" href="login-style.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  </head>
  <body>
    <div class="box">
      <img src="dpool.png" alt="Deadpool" class="deadpool-img">

      <div class="logo">
        <!-- Change the src below to your icon image when ready -->
        <img src="icon.png" alt="Logo" class="logo-img">
        <h2>Deadpool</h2>
      </div>

      <div class="heading">
        <h1>Welcome <span>Back</span></h1>
        <p>Log in to continue your gaming journey</p>
      </div>

      <form id="loginForm">
        <div class="field">
          <label for="username">Username or Email</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-user"></i>
            <input type="text" id="username" name="username" placeholder="Enter your username or email" required>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
            <i class="fa-regular fa-eye eye-icon"></i>
          </div>
        </div>

        <div class="row-between">
          <div class="remember">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Remember me</label>
          </div>
          <a href="#" class="forgot">Forgot Password?</a>
        </div>

        <button type="submit" class="submit">
          Log In
          <i class="fa-solid fa-arrow-right"></i>
        </button>

        <div class="divider">
          <span>or log in with</span>
        </div>

        <div class="social">
          <button type="button" class="social-btn">
            <i class="fa-brands fa-steam"></i>
            Steam
          </button>
          <button type="button" class="social-btn">
            <i class="fa-brands fa-google" style="color: #ea4335;"></i>
            Google
          </button>
          <button type="button" class="social-btn">
            <i class="fa-brands fa-discord" style="color: #5865f2;"></i>
            Discord
          </button>
        </div>
      </form>

      <div class="footer">
        Don't have an account?
        <a href="signup.html">Sign Up</a>
      </div>
    </div>

    <script src="login-script.js"></script>
  </body>
</html>
